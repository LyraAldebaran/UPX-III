<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solare</title>
    <link rel="stylesheet" href="./css/cad_login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=MuseoModerno:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  
</head>
  <body>

    <div class="container-fluid">
        <div class="row align-items-center" id="header">
            <div class="col-12 d-flex justify-content-center"><a href="./index.html"><img id="logo" src="./img/solare_junto 1.svg" alt=""></a></div>
        </div>
        <div class="row d-flex justify-content-center align-items-center" id="content">
            <div class="col-2" id="logo-form" style="background-color: #36320A; height: 60vh;">
                <img src="./img/logozinha.svg" alt="">
                <div class="text">
                    <h3>Seja bem vindo!</h3>
                    <p>Crie sua conta agora mesmo e comece a economizar!</p>
                    <p>Já possui conta? <a href="./login.html">Entrar</a></p>
                </div>
            </div>
            <div class="col-4 formulario" style="background-color: #FEFAA1; height: 60vh;">
                
                <form action="" method="post">
                        <div class="campo">
                            <img src="./img/ant-design_user-add-outlined.svg" alt="">
                            <input type="email" placeholder="Username" class="form-control" id="username" name="username">
                        </div>
                        <div class="campo">
                            <img src="./img/email.svg" alt="">
                            <input style="box-shadow: none;" type="email" placeholder="Email" class="form-control" id="email" name="email">
                        </div>
                        <div class="campo">
                            <img style="color: #FEFAA1;" src="./img/ri_lock-password-fill.svg" alt="">
                            <input type="password" placeholder="Senha" class="form-control" id="password" name="password">
                        </div>
                        <a style="text-decoration: none; color: white;" href="./envio_documentos.html">
                            <div class="campo" style="background-color: #A78700;">
                                <img src="./img/pasta.svg" alt="">
                                <h2 style="color: #FEFAA1; text-align: center; margin-left: 15%; font-size: 1.5em;">Envio de Documentos</h2>
                            </div>
                        </a>
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                </form>

            </div>
        </div>




    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
