<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solare</title>
    <link rel="stylesheet" href="./css/cad_login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=MuseoModerno:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  
</head>
  <body>

    <div class="container-fluid">
        <div class="row align-items-center" id="header">
            <div class="col-12 d-flex justify-content-center"><a href="./index.html"><img id="logo" src="./img/solare_junto 1.svg" alt=""></a></div>
        </div>
        <div class="row d-flex justify-content-center align-items-center" id="content">
            <div class="col-2" id="logo-form" style="background-color: #36320A; height: 60vh;">
                <img src="./img/logozinha.svg" alt="">
                <div class="text">
                    <h3>Seja bem vindo!</h3>
                    <p>Acesse sua conta agora mesmo e comece a economizar!</p>
                    <p>não possui conta? <a href="">Cadastrar</a></p>
                        <a href="" style="color: white; font-weight: bold; font-size: 1.2em; text-decoration: none; margin: 0;">Esqueci minha senha</a>
                </div>
            </div>
            <div class="col-6 formulario" style="background-color: #FEFAA1; height: 60vh;">
                
                <form action="" method="post">
                    <div class="mb-3">
                        <input type="email" placeholder="Username" class="form-control" id="username" name="username">
                    </div>
                    <div class="mb-3">
                        <input type="password" placeholder="Senha" class="form-control" id="password" name="password">
                    </div>
                    <button type="submit" class="btn btn-primary">Entrar</button>
                </form>

            </div>
        </div>




    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
